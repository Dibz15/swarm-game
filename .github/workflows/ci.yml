name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

# A new push to a PR cancels its older run. PRs group by number: a merged
# PR's "closed" run reports the base ref and must not cancel main's deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck, test, build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Clients must agree bit for bit: the sim has to hash the same under
      # JavaScriptCore (iOS Safari, via Bun) as under V8 (Node) (#160).
      # fullHash, as clients compare it: worldHash rounds and skips state.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Same world hashes under Bun and Node
        run: |
          npx vite-node scripts/hashtrace.ts 60 --full > hash-node.txt
          bun scripts/hashtrace.ts 60 --full > hash-bun.txt
          diff hash-node.txt hash-bun.txt

      - run: npm run build
        env:
          # The TURN credentials Worker (#163); unset: players connect directly only.
          VITE_TURN_URL: ${{ vars.TURN_URL }}

      # Hand the built site to the deploy jobs.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 3

  # The site lives on the gh-pages branch: main at the root, each open PR
  # under pr-preview/pr-<n>/. Only one job writes the branch at a time.
  deploy:
    name: Publish main to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

  preview:
    name: PR preview
    needs: test
    # Fork PRs get a read-only token, so they can't publish a preview.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy

  preview-cleanup:
    name: Remove PR preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
